# AGRESIVNÍ varianta – vědomě vysoké riziko („hazard s pravidly“)
# Aktivace: v .env nastav BOT_CONFIG=config-aggressive.yaml a restartuj bota.
#
# Oproti základní verzi: místo ETF poklesová strategie (30 %), dvojnásobné riziko na obchod,
# koncentrace do max. 3 pozic, volatilnější tituly, těsnější stopy.
# Očekávej velké výkyvy oběma směry; série 5–6 ztrátových obchodů za sebou
# znamená pokles účtu o 25–30 %.
environment: demo
dry_run: false

allocation:
  core_pct: 0.0
  active_pct: 0.68   # proražení a prudký růst, se stop-lossy
  dip_pct: 0.30      # nákup propadlých akcií, prodej po malém růstu, bez stop-lossu
  cash_buffer_pct: 0.02

risk:
  daily_loss_cap_pct: 0.12      # denní stopka až při -12 %
  max_drawdown_halt_pct: 0.50   # poslední záchranná brzda: -50 % z maxima → stop do /start
  risk_per_trade_pct: 0.05      # jeden obchod smí vzít 5 % účtu
  max_position_pct: 0.50        # jedna pozice až polovina účtu
  max_positions: 3
  min_order_value: 10
  min_order_value_by_ccy: {CZK: 250, EUR: 10, USD: 10, GBP: 10}

active:
  scan_every_minutes: 10
  skip_first_minutes_after_open: 15
  breakout_lookback_days: 10    # kratší okno → víc signálů, rychlejší obchody
  trend_sma_days: 20
  atr_days: 10
  stop_atr_mult: 1.5
  trail_atr_mult: 2.0
  max_hold_days: 8
  max_chase_pct: 0.15        # při proražení koupí až 15 % nad úrovní maxima
  spike_min_gain_pct: 0.07   # akcie dnes +7 % a víc = nákup i bez trendu a proražení
  min_atr_pct: 0.03             # jen opravdu pohyblivé akcie
  max_atr_pct: 0.20
  min_price: 3
  min_dollar_volume: 15000000

markets:
  us:
    enabled: true
    tz: America/New_York
    open: "09:30"
    close: "16:00"
    ref: SPY
    currency: USD
    universe: [TSLA, NVDA, AMD, PLTR, COIN, MSTR, HOOD, SOFI, RBLX, SHOP, ARM, SMCI, IONQ, RGTI, RKLB, ASTS, HIMS, UPST, AFRM, CVNA, APP, SOUN, MARA, RIOT, CRWD, NET, SNOW, U, AI, PATH]
  eu:
    enabled: true            # vypni (false), až budeš chtít jen USA
    tz: Europe/Berlin
    open: "09:00"
    close: "17:30"
    ref: "^GDAXI"
    currency: EUR
    # přípona tickeru v Trading 212 podle burzy (Xetra, Paříž, Amsterdam)
    t212_suffix: {".DE": "d", ".PA": "p", ".AS": "a"}
    overrides:
      min_dollar_volume: 5000000   # v EUR; evropské akcie mají menší objemy
      min_atr_pct: 0.02
    universe: [RHM.DE, IFX.DE, ENR.DE, ZAL.DE, DHER.DE, AIXA.DE, HAG.DE, CBK.DE, MTX.DE, R3NK.DE,
                STMPA.PA, UBI.PA, AIR.PA, ASML.AS, ADYEN.AS, BESI.AS, ASM.AS]

# Poklesová strategie: koupí akcii po prudkém propadu, prodá po malém růstu.
# ZÁMĚRNĚ BEZ STOP-LOSSU: když akcie neroste, drží ji, dokud cíle nedosáhne.
# Riziko: peníze můžou v propadlé akcii zůstat zamrzlé dlouho (i navždy).
# Strop: max. dip_pct účtu (30 %), rozdělené do max_positions pozic.
dip:
  enabled: true
  max_positions: 4           # 4 × 7,5 % účtu
  drop_days: 5               # pokles měřený od maxima posledních 5 dní
  min_drop_pct: 0.08         # koupí po poklesu aspoň o 8 %
  take_profit_pct: 0.04      # prodá při +4 % od nákupu
  min_price: 5
  min_dollar_volume: 20000000
  universe:
    # větší a stabilnější firmy, u kterých je návrat pravděpodobnější
    us: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, AMD, TSM, NFLX,
         CRM, ADBE, ORCL, COST, V, MA, JPM, LLY, UNH, TSLA]
    eu: [SAP.DE, SIE.DE, ALV.DE, ASML.AS, MC.PA, AIR.PA, SU.PA, OR.PA]

core:
  run_weekday: 0
  dip_threshold_pct: 0.10
  normal_fill_fraction: 0.25
  etfs:
    - name: Vanguard S&P 500 UCITS (Acc)
      isin: IE00BFMXXD54
      yahoo: VUAA.L
      weight: 0.5
    - name: iShares Nasdaq 100 UCITS (Acc)
      isin: IE00B53SZB19
      yahoo: CNDX.L
      weight: 0.5

order:
  qty_decimals: 2

report_time: "22:20"
