name: tradebot

on:
  schedule:
    # každých 5 minut v pracovní dny 13:00–21:59 UTC
    # (pokrývá obchodní hodiny v USA v létě i v zimě + denní report)
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

# nikdy dva běhy najednou (ochrana proti dvojím příkazům)
concurrency:
  group: tradebot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      # stav bota (pozice, historie, pojistky) mezi běhy
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run one cycle
        env:
          BOT_CONFIG: ${{ vars.BOT_CONFIG || 'config.yaml' }}
          T212_DEMO_API_KEY: ${{ secrets.T212_DEMO_API_KEY }}
          T212_DEMO_API_SECRET: ${{ secrets.T212_DEMO_API_SECRET }}
          T212_LIVE_API_KEY: ${{ secrets.T212_LIVE_API_KEY }}
          T212_LIVE_API_SECRET: ${{ secrets.T212_LIVE_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tradebot.main --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
